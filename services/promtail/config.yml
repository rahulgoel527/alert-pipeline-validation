server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=alertlab"]
    relabel_configs:
      # Use the compose service name as the "service" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.*)'
        target_label: container
      - replacement: alertlab
        target_label: job
    pipeline_stages:
      # Parse JSON log lines emitted by log() in infra.py
      - json:
          expressions:
            level: level
            alert_id: alert_id
            message: message
      # Promote level and alert_id as Loki labels for fast filtering
      - labels:
          level:
          alert_id:
