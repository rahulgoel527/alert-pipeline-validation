global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: alert_pipeline_api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: elasticsearch
    static_configs:
      - targets: ['elasticsearch_exporter:9114']
