name: alertlab

services:

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [pipeline_net]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: alert_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger123
    networks: [pipeline_net]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d alert_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports: ["9200:9200"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:1358,http://127.0.0.1:1358
      - http.cors.allow-headers=X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization
      - http.cors.allow-credentials=true
    networks: [pipeline_net]
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    profiles: [pipeline]
    env_file: .env
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      ELASTICSEARCH_HOST: elasticsearch
    ports: ["8000:8000"]
    networks: [pipeline_net]
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}

  event_generator:
    build:
      context: .
      dockerfile: event_generator/Dockerfile
    profiles: [pipeline]
    env_file: .env
    environment:
      API_HOST: api
    networks: [pipeline_net]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    depends_on:
      api: {condition: service_healthy}

  event_processor:
    build:
      context: .
      dockerfile: event_processor/Dockerfile
    profiles: [pipeline]
    env_file: .env
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      ELASTICSEARCH_HOST: elasticsearch
    networks: [pipeline_net]
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      ELASTICSEARCH_HOST: elasticsearch
    ports: ["8050:8050"]
    networks: [pipeline_net]
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}

  dejavu:
    image: appbaseio/dejavu
    ports: ["1358:1358"]
    networks: [pipeline_net]

  # ---------------------------------------------------------------------------
  # Observability stack
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.51.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [pipeline_net]
    depends_on:
      api: {condition: service_healthy}

  grafana:
    image: grafana/grafana:10.4.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [pipeline_net]
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:2.9.4
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml
    networks: [pipeline_net]

  promtail:
    image: grafana/promtail:2.9.4
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [pipeline_net]
    depends_on: [loki]

  redis_exporter:
    image: oliver006/redis_exporter:v1.58.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks: [pipeline_net]
    depends_on:
      redis: {condition: service_healthy}

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://ledger:ledger123@postgres:5432/alert_ledger?sslmode=disable"
    networks: [pipeline_net]
    depends_on:
      postgres: {condition: service_healthy}

  elasticsearch_exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.7.0
    command: ["--es.uri=http://elasticsearch:9200", "--es.all", "--es.indices"]
    networks: [pipeline_net]
    depends_on:
      elasticsearch: {condition: service_healthy}

networks:
  pipeline_net:
    driver: bridge
