[pytest]
testpaths = .
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: End-to-end pipeline flow tests
    duplicates: Duplicate detection tests
    failures: Failure injection and recovery tests
    slow: Tests that take longer (container restarts, large bursts)
    load: Load/performance tests
    unit: Unit tests — no running services required
addopts = -v --tb=short -p no:xdist
