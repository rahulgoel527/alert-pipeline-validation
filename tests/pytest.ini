[pytest]
testpaths = .
pythonpath = . ../services
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests — no running services required
    e2e: End-to-end pipeline tests — requires running lab
    slow: Container-restart tests — subset of e2e, requires Docker socket
    load: Locust throughput tests — separate from pytest suite
addopts = -v --tb=short -p no:xdist
